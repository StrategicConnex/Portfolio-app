name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Lint, TypeCheck, Test, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_VERCEL_URL: ${{ vars.VERCEL_URL || 'juanpalacios.vercel.app' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || '' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || '' }}
          CONTACT_TO_EMAIL: ${{ secrets.CONTACT_TO_EMAIL || '' }}
          CONTACT_FROM_EMAIL: ${{ secrets.CONTACT_FROM_EMAIL || 'portfolio@juanpalacios.vercel.app' }}

  e2e:
    name: E2E (Playwright · production build)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application (production)
        # NEXT_PUBLIC_E2E_ERROR_ROUTE arms the dev-only /test-error route so
        # the e2e error-boundary test can run against the production build.
        # Real production deployments omit it and keep serving a 404 there.
        run: npm run build
        env:
          NEXT_PUBLIC_VERCEL_URL: ${{ vars.VERCEL_URL || 'juanpalacios.vercel.app' }}
          NEXT_PUBLIC_E2E_ERROR_ROUTE: '1'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || '' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || '' }}
          CONTACT_TO_EMAIL: ${{ secrets.CONTACT_TO_EMAIL || '' }}
          CONTACT_FROM_EMAIL: ${{ secrets.CONTACT_FROM_EMAIL || 'portfolio@juanpalacios.vercel.app' }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests against production server
        run: npx playwright test
        env:
          E2E_PROD_SERVER: '1'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy (Vercel · producción)
    runs-on: ubuntu-latest
    needs: [validate, e2e]
    # Solo push a main (o disparo manual desde Actions sobre main): el deploy
    # de producción queda gateado por validate + e2e verdes.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel project
        # Fija el proyecto por team + nombre (strategicconnex/juanpalacios) y
        # escribe .vercel/project.json; el paso siguiente exige el project ID exacto.
        run: vercel link --yes --project juanpalacios --scope strategicconnex --token=${{ secrets.VERCEL_TOKEN }}

      - name: Verify Vercel project ID
        # Hard-fail si el proyecto vinculado no es el de producción esperado
        # (prj_KmY2dJJgbui7LhuQyxZPKTU08T1h) — nunca desplegar a otro proyecto.
        run: |
          PROJECT_ID=$(node -p "require('./.vercel/project.json').projectId")
          if [ "$PROJECT_ID" != "prj_KmY2dJJgbui7LhuQyxZPKTU08T1h" ]; then
            echo "::error::Unexpected Vercel project ID: $PROJECT_ID (expected prj_KmY2dJJgbui7LhuQyxZPKTU08T1h)"
            exit 1
          fi
          echo "Vercel project linked: strategicconnex/juanpalacios ($PROJECT_ID)"

      - name: Pull Vercel Environment Information
        # Trae las env vars de producción del proyecto Vercel (OPENROUTER_API_KEY,
        # RESEND_API_KEY, etc. se configuran una sola vez en el dashboard).
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        # --prebuilt: el build corre en el runner de Actions y solo se sube
        # .vercel/output a Vercel (sin doble build, gateado por los checks).
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_VERCEL_URL: ${{ vars.VERCEL_URL || 'juanpalacios.vercel.app' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || '' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || '' }}
          CONTACT_TO_EMAIL: ${{ secrets.CONTACT_TO_EMAIL || '' }}
          CONTACT_FROM_EMAIL: ${{ secrets.CONTACT_FROM_EMAIL || 'portfolio@juanpalacios.vercel.app' }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
