name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate (Lint, TypeCheck, Test, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_VERCEL_URL: ${{ vars.VERCEL_URL || 'juanpalacios.vercel.app' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || '' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || '' }}
          CONTACT_TO_EMAIL: ${{ secrets.CONTACT_TO_EMAIL || '' }}
          CONTACT_FROM_EMAIL: ${{ secrets.CONTACT_FROM_EMAIL || 'portfolio@juanpalacios.vercel.app' }}
